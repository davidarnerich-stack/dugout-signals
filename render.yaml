services:
  - type: web
    name: dugout-signals
    runtime: python
    buildCommand: pip install -r requirements.txt
    # 300s, not because a request should ever take that long — report
    # generation now runs its sections concurrently and should finish well
    # inside 60s — but so that a slow upstream degrades into a slow response
    # rather than a killed worker. A killed worker returns an HTML error
    # page, which the client cannot parse as JSON, so the coach sees
    # "Unexpected token '<'" instead of anything actionable.
    startCommand: gunicorn app:app --timeout 300 --workers 2
    plan: starter          # $7/mo — no cold starts; use "free" to start for $0
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value
      - key: SUPABASE_URL
        value: https://bqjbswbxtyapupufoarv.supabase.co
      - key: SUPABASE_KEY
        sync: false           # You set this manually in Render dashboard
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxamJzd2J4dHlhcHVwdWZvYXJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY0ODk2MzMsImV4cCI6MjA3MjA2NTYzM30.LBHDFQy1Nvr_0yvd2reub6VLsvrxKKvYzVaQCl64LNE
        # Publishable key — safe to commit, used only for Auth (signup/resend/session)
      - key: SITE_URL
        value: https://app.dugoutsignals.ai
        # Base URL for Supabase email-confirmation redirect links (DS-52)
