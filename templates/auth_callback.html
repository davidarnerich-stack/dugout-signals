<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dugout Signals — Confirming…</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<style>
  body {
    background: #0d1117; color: #8b949e; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
  }
</style>
</head>
<body>
<p>Confirming your account&hellip;</p>
<script>
  (function () {
    var params = new URLSearchParams(window.location.hash.slice(1));
    var accessToken = params.get('access_token');
    var refreshToken = params.get('refresh_token');
    if (!accessToken || !refreshToken) {
      window.location = '/signup';
      return;
    }
    fetch('/auth/callback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ access_token: accessToken, refresh_token: refreshToken })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) { window.location = data.redirect || '/signup'; })
      .catch(function () { window.location = '/signup'; });
  })();
</script>
</body>
</html>
