<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dugout Signals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── 3-level palette ────────────────────────────────────────────────────
       bg:      #0d1117  near-black, neutral (no blue cast)
       surface: #161b22  card — one clear step lighter
       border:  #30363d  clean separator
       accent:  #38bdf8  sky blue — pops against the neutral darks
    ── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 2.5rem 2rem 2rem;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 24px 64px rgba(0,0,0,.6);
    }

    /* ── Logo section ──
       .logo-inner sets a fixed width that the image and wordmark both share,
       so D and T of DUGOUT align exactly with the logo edges.
    ── */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;                   /* tight coupling — controlled by margin-bottom on img */
      margin-bottom: 2rem;
    }
    .logo-inner {
      width: 155px;             /* image + text share this width */
    }
    .logo-inner img {
      display: block;
      width: 100%;              /* fills container width → aspect ratio preserved */
      height: auto;             /* no letterboxing → border-radius clips real corners */
      border-radius: 16px;
      margin-bottom: .55rem;    /* gap between logo and wordmark */
    }
    .logo-wordmark {
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      line-height: 1.2;
      width: 100%;
    }
    .logo-dugout {
      display: block;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: .12em;
      color: #f0f6fc;
    }
    .logo-signals {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .35em;
      color: #38bdf8;
      margin-top: .15rem;
    }

    /* ── Form ── */
    label {
      display: block;
      color: #8b949e;
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: .4rem;
    }
    input[type=password] {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: .7rem 1rem;
      color: #f0f6fc;
      font-size: 1rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type=password]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56,189,248,.12);
    }
    button {
      width: 100%;
      margin-top: 1.2rem;
      background: #0ea5e9;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: .75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      letter-spacing: .02em;
    }
    button:hover { background: #0284c7; }
    .error {
      margin-top: 1rem;
      background: #1a0a0a;
      border: 1px solid #6b1a1a;
      color: #fca5a5;
      border-radius: 6px;
      padding: .6rem .8rem;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-inner">
        <img src="/static/logo-icon.svg" alt="Dugout Signals">
        <div class="logo-wordmark">
          <span class="logo-dugout">DUGOUT</span>
          <span class="logo-signals">SIGNALS</span>
        </div>
      </div>
    </div>
    <form method="post">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="Enter password" autofocus autocomplete="current-password">
      <button type="submit">Sign In</button>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="error">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
    </form>
  </div>
</body>
</html>
