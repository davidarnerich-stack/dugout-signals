<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dugout Signals — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -.02em;
    }
    .logo span { color: #38bdf8; }
    .logo p { color: #94a3b8; font-size: .85rem; margin-top: .25rem; }
    label { display: block; color: #94a3b8; font-size: .8rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: .05em; margin-bottom: .4rem; }
    input[type=password] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: .7rem 1rem;
      color: #f1f5f9;
      font-size: 1rem;
      outline: none;
      transition: border-color .15s;
    }
    input[type=password]:focus { border-color: #38bdf8; }
    button {
      width: 100%;
      margin-top: 1.2rem;
      background: #0ea5e9;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: .75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #0284c7; }
    .error {
      margin-top: 1rem;
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 6px;
      padding: .6rem .8rem;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Dugout <span>Signals</span></h1>
      <p>Storm 12U All-Stars · Data Hub</p>
    </div>
    <form method="post">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="Enter password" autofocus autocomplete="current-password">
      <button type="submit">Sign In</button>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="error">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
    </form>
  </div>
</body>
</html>
